<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Connect | Unofficial demo</title>
<style>body{margin:0;background:#f3f5fa;color:#123269;font:16px system-ui}header{background:#123269;color:white;padding:28px 5%}header small{color:#ffffff}h1{margin:6px 0}main{max-width:1150px;margin:28px auto;padding:0 22px}button,input,select{font:inherit;padding:10px;border:1px solid #b9c7bc;border-radius:6px}button{background:#c92032;color:white;cursor:pointer;margin:4px}button:hover{background:#123269}label{display:block;margin:12px 0}input[type=number]{width:65px}article,section{background:white;padding:22px;margin:18px 0;border-radius:10px;border:1px solid #dbe1d8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#52617b}.status{background:#eaf0fb;padding:5px 9px;border-radius:4px}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #ddd;padding:10px}#message{position:sticky;top:0;background:#fff0c9;padding:12px;display:none}h2{font-size:25px}h3{margin-top:5px}.right{float:right}details{margin:12px 0}a{color:#c92032}</style>
<header><small>INDEPENDENT • UNOFFICIAL PROPOSAL • SYNTHETIC DATA ONLY</small><h1>Food City Community Connect</h1><div>Local prototype for neighborhood grocery delivery and delivery fee assistance</div></header><figure style="margin:0;background:#123269;color:white"><img src="/assets/porch.png" alt="Illustrative grocery delivery to smiling neighbors" style="width:100%;max-height:320px;object-fit:cover;object-position:center 45%"><figcaption style="font-size:12px;padding:6px 5%">AI-generated illustrative scene. Fictional people, not actual Food City customers or an endorsement.</figcaption></figure><main><div id="message" role="status"></div><div id="app"></div></main>
<script>
const app=document.querySelector('#app');let state;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+(n/100).toFixed(2);
async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
function msg(t){let el=document.querySelector('#message');el.textContent=t;el.style.display='block'}
function login(){app.innerHTML=`<section style="max-width:510px"><h2>Explore the pilot</h2><p>All accounts use password <b>demo</b>. Demo access only. Do not enter personal information.</p><form id="login"><label>Console <select id="username"><option value="customer">Customer · Alex Reed</option><option value="neighbor">Customer · Morgan Lane (assistance approved)</option><option value="driver">Employee · Taylor Brooks</option><option value="manager">Management · Casey Hill</option></select></label><label>Password <input id="password" type="password" value="demo"></label><button>Open console</button></form></section><p class="muted">No Food City affiliation or system connection. Checkout, dispatch and fuel vouchers are simulations.</p>`;document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await api('login',{username:document.querySelector('#username').value,password:document.querySelector('#password').value});load()}catch(e){msg(e.message)}}}
async function act(action,id,extra={}){try{await api('action',{action,id,...extra});msg('Saved.');await load()}catch(e){msg(e.message)}}
const btn=(label,a,id)=>`<button onclick="act('${a}',${id})">${label}</button>`;
async function load(){try{state=await api('state')}catch{login();return}let r=state.role;app.innerHTML=`<button class="right" onclick="logout()">Switch account</button><h2>${esc(r[0].toUpperCase()+r.slice(1))} console</h2><p class="muted">Demo store 001 · 5-mile default radius plus employee-added rural map routes · two daily delivery windows</p><div id="body"></div>`;let html=routeMap()+dutyPanel();
if(r==='customer'){html+=`<section><h3>Build a grocery order</h3><p>$15 minimum basket. Delivery fee $4.95. Groceries remain customer funded. Demo prices exclude tax.</p><div class="grid">${state.catalog.map((p,i)=>`<label>${esc(p.name)}<br>${money(p.cents)} <input aria-label="Quantity ${esc(p.name)}" id="q${i}" type="number" min="0" max="10" value="0"></label>`).join('')}</div><label>Delivery coverage <select id="routeid"><option value="">Within default 5-mile radius</option>${state.routes.map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.miles} miles · employee ${x.employee}</option>`).join('')}</select></label><label>Route / neighborhood (synthetic only) <input id="route" value="Demo neighborhood" maxlength="100"></label><label>Estimated delivery miles <input id="estm" type="number" min="0.1" step="0.1" value="4.5"></label><label>Estimated delivery minutes <input id="estt" type="number" min="1" value="30"></label><p>The 5-mile radius applies unless an employee adds a route to the delivery map. Select that corridor for a rural exception. Safe access, coverage and paid work capacity still apply.</p><label><input id="assisted" type="checkbox"> Use approved delivery fee assistance (four deliveries per 30-day approval)</label><button onclick="order()">Place simulated order</button></section><section><h3>Delivery assistance</h3><p>Proposed criteria: household with a transportation barrier, within the default radius or an employee-added map route, including older adults or residents with mobility limitations. Manager review required. No medical records needed.</p><input id="reason" maxlength="200" placeholder="Short synthetic reason" aria-label="Assistance reason"><button onclick="act('apply',null,{reason:document.querySelector('#reason').value})">Request review</button>${state.applications.map(a=>`<p>Application ${a.id}: <b>${esc(a.status)}</b> · ${esc(a.note)}<br>Expires ${esc(a.expires||'after approval')} · ${a.used}/4 uses</p>`).join('')}</section>`}
if(r==='management'){html+=`<section><h3>Pilot scorecard · live demo records</h3><div class="grid">${Object.entries(state.metrics).map(([k,v])=>`<div><b style="font-size:27px">${esc(v??'—')}</b><br>${esc(k.replaceAll('_',' '))}</div>`).join('')}</div><p class="muted">Fees are simulated earned delivery fees on completed orders. On-time uses employee confirmation. Labor covers delivery time only. This seeded snapshot is not pilot evidence.</p><button onclick="download()">Export scorecard JSON</button></section><section><h3>Eligibility review queue</h3>${state.applications.map(a=>`<article><b>Application ${a.id} · household ${a.customer}</b><p>${esc(a.reason)} · ${esc(a.status)}</p>${a.status==='pending'?`<input id="n${a.id}" aria-label="Review reason" placeholder="Review rationale"><button onclick="review(${a.id},'approved')">Approve 30 days</button><button onclick="review(${a.id},'denied')">Deny with reason</button>`:esc(a.note)}</article>`).join('')}</section>`}
if(r==='employee')html+=`<section><h3>Voluntary assignments</h3><p>Choose rural or homeward routes that work for you, including neighbors beyond town. Accept a delivery only when available for paid duty. Declining has no penalty. One active assignment at a time. Fuel rewards supplement wages and mileage reimbursement.</p><p class="muted">Offers show only order contents and estimated route distance. Address and phone data are deliberately absent in this local demo.</p></section>`;
html+=`<section><h3>${r==='employee'?'Available and assigned deliveries':'Orders and dispatch'}</h3>${state.orders.map(o=>{let buttons='';if(r==='management'){let map={placed:['Start picking','pick'],picking:['Mark ready','ready'],ready:['Offer to employees','offer']};if(map[o.status])buttons+=btn(...map[o.status],o.id);if(['placed','picking','ready','offered'].includes(o.status))buttons+=btn('Cancel','cancel',o.id)}if(r==='customer'&&['placed','picking'].includes(o.status))buttons+=btn('Cancel','cancel',o.id);if(r==='employee'){if(o.status==='offered')buttons+=btn('Accept paid assignment','accept',o.id);if(o.status==='accepted')buttons+=btn('Depart','depart',o.id)+btn('Release assignment','release',o.id);if(o.status==='out_for_delivery')buttons+=`<label>Actual minutes <input id="t${o.id}" type="number" value="${o.minutes}"></label><label>Actual miles <input id="m${o.id}" type="number" step="0.1" value="${o.miles}"></label><label><input id="p${o.id}" type="checkbox"> Handoff and safe handling confirmed</label><label><input id="on${o.id}" type="checkbox" checked> Arrived within promised window</label><button onclick="complete(${o.id})">Complete delivery</button><button onclick="complete(${o.id},true)">Record failed delivery</button>`}return `<article><span class="right status">${esc(o.status.replaceAll('_',' '))}</span><h3>#${o.id}</h3><p>Basket ${money(o.subtotal)} · Delivery ${money(o.fee)} · ${o.assisted?'Fee assistance':'Paid delivery'}</p><p><b>${esc(o.route)}</b><br>${o.miles} route miles · ${o.minutes} minutes ${o.driver?'· assigned employee '+o.driver:''}</p><details><summary>Basket details</summary>${JSON.parse(o.basket).map(p=>`<p>${p.qty} × ${esc(p.name)} · ${money(p.cents)}</p>`).join('')}</details>${buttons}</article>`}).join('')||'<p>No orders in this view.</p>'}</section>`;
if(r!=='customer')html+=`<section><h3>Supplementary fuel reward ledger</h3><p>$2 per completed delivery. Manager approves, then records simulated issue in the biweekly batch. No real voucher or Gas ’N Go integration.</p><table><tr><th>Order</th><th>Employee</th><th>Reward</th><th>Status</th><th>Action</th></tr>${state.rewards.map(x=>`<tr><td>${x.order_id}</td><td>${x.employee}</td><td>${money(x.cents)}</td><td>${esc(x.status)}</td><td>${r==='management'&&x.status!=='issued'?btn(x.status==='pending'?'Approve':'Record demo issue','reward',x.id):''}</td></tr>`).join('')}</table></section>`;
if(r==='management')html+=`<section><h3>Activity log</h3>${state.audit.map(a=>`<p>${esc(a.at)} · actor ${a.actor} · ${esc(a.action)} · ${esc(a.detail)}</p>`).join('')||'No new actions yet.'}</section>`;document.querySelector('#body').innerHTML=html}
function dutyPanel(){if(state.role==='customer')return '';return `<section><h3>Store manager staffing release</h3><p>The store manager decides whether an employee can be spared. Employee route selection and acceptance remain voluntary.</p>${state.duty.map(d=>`<article><b>Employee ${d.employee}: ${d.released?'Released for delivery duty':'Store duty · delivery departure blocked'}</b><p>${esc(d.note)}</p>${state.role==='management'?`<input id="dn${d.employee}" aria-label="Staffing decision reason" placeholder="Store coverage / staffing reason"><button onclick="act('duty',null,{employee:${d.employee},released:${!d.released},note:document.querySelector('#dn${d.employee}').value})">${d.released?'Recall after current delivery':'Release for delivery duty'}</button>`:''}</article>`).join('')}<p class="muted">Release permits acceptance and departure. Recall blocks new acceptance/departure, while an employee already on the road can safely complete the current delivery. No automatic overtime or insurance approval.</p></section>`}
function routeMap(){const dirs={N:[0,-1],NE:[.7,-.7],E:[1,0],SE:[.7,.7],S:[0,1],SW:[-.7,.7],W:[-1,0],NW:[-.7,-.7]};let lines=state.routes.map(x=>{let d=dirs[x.direction],px=250+d[0]*170,py=180+d[1]*135;return `<line x1="250" y1="180" x2="${px}" y2="${py}" stroke="#c92032" stroke-width="3"/><circle cx="${px}" cy="${py}" r="7" fill="#c92032"/><text x="${px}" y="${py-14}" text-anchor="middle" font-size="13" fill="#123269">Route ${x.id} · ${x.miles} mi</text>`}).join('');return `<section><h3>Delivery coverage map</h3><p>Default 5-mile radius. Employee-added routes extend coverage along the listed corridors. Synthetic schematic only, not a navigation map or address validation.</p><svg viewBox="0 0 500 360" role="img" aria-label="Schematic delivery coverage map" style="width:100%;max-width:640px;background:#f3f5fa"><circle cx="250" cy="180" r="65" fill="#e1e9f8" stroke="#123269" stroke-dasharray="5 4"/>${lines}<circle cx="250" cy="180" r="9" fill="#123269"/><text x="250" y="205" text-anchor="middle" fill="#123269">Demo store · 5-mile radius</text></svg>${state.routes.map(x=>`<p><b>Route ${x.id}: ${esc(x.name)}</b> · ${x.miles} miles · ${x.minutes} min · added by employee ${x.employee}</p>`).join('')}${state.role==='employee'?`<h3>Add a route you can serve</h3><p>Adding a route creates a coverage exception, not a commitment to accept every order.</p><label>Synthetic corridor name <input id="rn" placeholder="Mountain neighbors demo route" maxlength="100"></label><label>Delivery miles <input id="rm" type="number" min="0.1" step="0.1" value="18"></label><label>Delivery minutes <input id="rt" type="number" min="1" value="45"></label><label>Map direction <select id="rd">${Object.keys(dirs).map(k=>`<option>${k}</option>`).join('')}</select></label><button onclick="act('add_route',null,{name:document.querySelector('#rn').value,miles:document.querySelector('#rm').value,minutes:document.querySelector('#rt').value,direction:document.querySelector('#rd').value})">Add to delivery map</button>`:''}</section>`}
async function logout(){await api('logout',{});login()}
function order(){let quantities={};state.catalog.forEach((_,i)=>quantities[i]=document.querySelector('#q'+i).value);act('order',null,{quantities,assisted:document.querySelector('#assisted').checked,route_id:document.querySelector('#routeid').value,route:document.querySelector('#route').value,estimate_miles:document.querySelector('#estm').value,estimate_minutes:document.querySelector('#estt').value})}
function review(id,decision){act('review',id,{decision,note:document.querySelector('#n'+id).value})}
function complete(id,fail=false){act(fail?'fail':'deliver',id,{minutes:document.querySelector('#t'+id).value,miles:document.querySelector('#m'+id).value,proof:document.querySelector('#p'+id).checked?'confirmed':'',ontime:document.querySelector('#on'+id).checked})}
function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({generated:new Date().toISOString(),synthetic:true,...state.metrics},null,2)],{type:'application/json'}));a.download='synthetic-pilot-scorecard.json';a.click();URL.revokeObjectURL(a.href)}load();
</script></html>
